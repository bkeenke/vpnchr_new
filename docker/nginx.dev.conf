# nginx перед next dev. Все запросы, включая /api, идут в Next:
# маршрут /api/* держит сессию в httpOnly-cookie и защищает от CSRF,
# а к SHM (SHM_URL) обращается уже сервер Next.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen       80;
    server_name  localhost;
    absolute_redirect off;
    charset utf-8;
    client_max_body_size 10M;

    set_real_ip_from    0.0.0.0/0;
    real_ip_header      X-Forwarded-For;
    real_ip_recursive   on;

    location = /healthcheck {
        access_log off;
        return 200 "ok\n";
    }

    # Админка SHM из кабинета недоступна
    location ~* ^/(api|shm/v1)/admin {
        return 403;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        # WebSocket для горячей перезагрузки (HMR)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
